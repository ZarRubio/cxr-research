# Protocolo nuevo de referencia: backbone preentrenado fuera de NIH.
# Mantener este split y la arquitectura fijos para compararlo con
# sprint4_multilabel_v3_nih_control.yaml.
project:
  name: "tesis-cxr-sprint4-multilabel-v3-chex-init"
  sprint: "4-multilabel-v3"
  seed: 42

paths:
  project_root:   "."
  data_raw:       "./data/raw/nih"
  data_processed: "./data/processed_s4ml_v3"
  experiments:    "./experiments_s4ml_v3_chex"
  checkpoints:    "./experiments_s4ml_v3_chex/checkpoints"
  logs:           "./experiments_s4ml_v3_chex/logs"

dataset:
  name: "nih_multilabel"
  csv_filename: "Data_Entry_subset_local.csv"
  views: ["PA", "AP"]
  num_classes: 14

preprocessing:
  image_size: 224
  transform: "multilabel_v2"

splits:
  train_ratio: 0.70
  val_ratio:   0.15
  test_ratio:  0.15
  split_by:    "patient_id"
  all_images_per_patient: true

model:
  # XRV weights trained on CheXpert, not NIH; the classification head is replaced.
  backbone:    "densenet121-res224-chex"
  num_classes: 14
  pretrained:  true
  vit:
    embedding_dim: 512
    num_heads:     8
    num_layers:    6
    mlp_dim:       1024
    dropout:       0.1

training:
  batch_size:     32
  num_workers:    2
  use_amp:        true
  use_pos_weight: true

  phase1:
    epochs:        15
    learning_rate: 0.0001
    weight_decay:  0.0001
    patience:      6
    warmup_epochs: 3

  phase2:
    epochs:      45
    lr_cnn:      0.000002
    lr_vit:      0.00005
    weight_decay: 0.0001
    patience:    12
    scheduler:
      type:     "ReduceLROnPlateau"
      mode:     "max"
      factor:   0.5
      patience: 4
      min_lr:   0.000001

evaluation:
  metrics: ["auc_per_class", "auc_macro", "map", "accuracy_per_class"]
  threshold: 0.5
